job_name: bump-dep-fix-skills-dir-test
jobs_dir: /root/harbor-bump-eval/jobs

orchestrator:
  n_concurrent_trials: 1

agents:
  - name: claude-code
    kwargs:
      skills_dir: ~/.claude/skills
    env:
      ANTHROPIC_AUTH_TOKEN: "sk-sp-xxx"
      ANTHROPIC_BASE_URL: "https://coding.dashscope.aliyuncs.com/apps/anthropic"
      ANTHROPIC_MODEL: "qwen3.5-plus"
      ANTHROPIC_SMALL_FAST_MODEL: "qwen3.5-plus"

datasets:
  - path: /root/harbor-bump-eval
    task_names:
      - task-bump-alphagov-logback-classic
